name: Build FCX release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FCX/package-lock.json

      - name: Install userscript dependencies
        working-directory: FCX
        run: npm ci

      - name: Check and build userscript
        working-directory: FCX
        run: npm run check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt pytest

      - name: Test backend
        run: python -m pytest backend/tests -q

      - name: Build backend EXE
        shell: powershell
        run: ./backend/build_gui.ps1

      - name: Finalize release files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          node FCX/scripts/assemble-release.mjs

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCX-${{ github.ref_name }}-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $backendAsset = Get-ChildItem -Path "dist" -Filter "*.exe" |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $backendAsset) {
            throw "Backend executable was not found in dist."
          }
          $assets = @(
            "dist/FCX.js",
            $backendAsset,
            "dist/routines.json",
            "dist/version.json",
            "dist/SHA256SUMS.txt"
          )
          cmd /d /c "gh release view `"$tag`" >nul 2>&1"
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets `
              --title "FCX $tag" `
              --generate-notes `
              --verify-tag
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
